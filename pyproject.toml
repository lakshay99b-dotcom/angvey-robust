[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angvey-robust"
version = "0.1.0"
description = "Lightweight robustness layer for AI agents — self-reflection, failure memory, drift detection, and continuous improvement"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "angvey int", email = "angvey@int.dev"}
]
keywords = [
    "ai", "agents", "agentic", "robustness", "self-reflection",
    "evaluation", "metacognition", "llm", "reliability"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.0.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/lakshay99b-dotcom/angvey-robust"
Repository = "https://github.com/lakshay99b-dotcom/angvey-robust"
Issues = "https://github.com/lakshay99b-dotcom/angvey-robust/issues"

[project.scripts]
angvey-robust = "angvey_robust.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
